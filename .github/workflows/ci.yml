name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token: CI only needs to check out the code.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves between releases
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json # uses engines.node, so CI always matches the project
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Also enforced before each commit, but hooks can be skipped (--no-verify, edits on GitHub).
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e

      # Only the e2e step writes traces, so upload them only when it was the step that failed.
      - name: Upload Playwright traces
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
